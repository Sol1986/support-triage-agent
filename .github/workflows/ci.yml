name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_ENABLED: "false"
  GEMINI_MODEL: "gemini-3.6-flash"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

  tests:
    name: Automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run test suite with coverage
        run: >
          uv run pytest
          --cov=support_triage_agent
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
          -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: support-triage-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: >
          docker run
          --detach
          --name support-triage-api
          --publish 8000:8000
          --env LLM_ENABLED=false
          support-triage-agent:ci

      - name: Run container smoke test
        shell: bash
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi

            sleep 2
          done

          docker logs support-triage-api
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs support-triage-api

      - name: Remove test container
        if: always()
        run: docker rm --force support-triage-api  