[project]
name = "support-triage-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "“Sol1986”", email = "“sol.farahmand1986@gmail.com”" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.17.0",
    "langgraph>=1.2.10",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
support-triage-agent = "support_triage_agent:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.coverage.run]
source = ["support_triage_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
